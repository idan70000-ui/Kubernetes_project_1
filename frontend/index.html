<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>עוגיות המזל</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Inter:wght@300;400;500&display=swap">

<style>
:root {
  --bg:        #07070f;
  --surface:   #0e0e1f;
  --rim:       #1c1c38;
  --gold:      #f2b830;
  --gold-soft: #e8a520;
  --gold-glow: rgba(242,184,48,.18);
  --gold-dim:  #7a5c14;
  --text:      #f0ece2;
  --muted:     #6a647e;
  --purple:    #8b7cf8;
  --danger:    #e06c75;
  --serif:     'Cormorant Garamond', Georgia, serif;
  --sans:      'Inter', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark } }
:root[data-theme="dark"] { color-scheme: dark }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }

html, body { height: 100% }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding-block: 56px;
  padding-left:  max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
}

/* Deep nebula background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 50% at 20% 30%, rgba(80,40,140,.18) 0%, transparent 70%),
    radial-gradient(ellipse 50% 40% at 80% 70%, rgba(40,80,160,.14) 0%, transparent 70%),
    radial-gradient(ellipse 40% 30% at 60% 20%, rgba(160,100,20,.1)  0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

/* Starfield canvas */
#stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}

.page {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 500px;
  text-align: center;
}

/* Header */
.eyebrow {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--gold-dim);
  margin-bottom: 14px;
}

h1 {
  font-family: var(--serif);
  font-size: clamp(2.6rem, 8vw, 3.8rem);
  font-weight: 600;
  color: var(--gold);
  line-height: 1.1;
  text-shadow: 0 0 60px rgba(242,184,48,.3);
  text-wrap: balance;
  margin-bottom: 10px;
}

.subtitle {
  font-size: 13px;
  font-weight: 300;
  color: var(--muted);
  letter-spacing: .03em;
  margin-bottom: 52px;
}

/* Ornament line */
.ornament {
  display: flex;
  align-items: center;
  gap: 12px;
  justify-content: center;
  margin-bottom: 52px;
}
.ornament::before, .ornament::after {
  content: '';
  flex: 1;
  max-width: 80px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold-dim));
}
.ornament::after { background: linear-gradient(90deg, var(--gold-dim), transparent) }
.ornament span { color: var(--gold-dim); font-size: 16px }

/* Cookie stage */
.stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 32px;
  margin-bottom: 40px;
}

.cookie-ring {
  position: relative;
  width: 160px;
  height: 160px;
}

/* Pulsing halo */
@keyframes halo {
  0%, 100% { opacity: .3; transform: scale(1) }
  50%       { opacity: .6; transform: scale(1.06) }
}
.halo {
  position: absolute;
  inset: -16px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--gold-glow) 0%, transparent 70%);
  animation: halo 3s ease-in-out infinite;
}

.cookie-btn {
  position: relative;
  z-index: 1;
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
  width: 160px;
  height: 160px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.cookie-svg {
  width: 140px;
  height: 140px;
  filter: drop-shadow(0 0 20px rgba(242,184,48,.4));
  transition: transform .3s cubic-bezier(.34,1.56,.64,1), filter .3s;
}
.cookie-btn:hover .cookie-svg {
  transform: scale(1.1) rotate(-3deg);
  filter: drop-shadow(0 0 36px rgba(242,184,48,.65));
}
.cookie-btn:active .cookie-svg { transform: scale(.94) }

@keyframes crack {
  0%  { transform: scale(1) rotate(0deg) }
  20% { transform: scale(1.12) rotate(-8deg) }
  40% { transform: scale(1.1) rotate(7deg) }
  60% { transform: scale(1.08) rotate(-4deg) }
  80% { transform: scale(1.04) rotate(2deg) }
  100%{ transform: scale(1) rotate(0deg) }
}
.cookie-btn.cracking .cookie-svg { animation: crack .5s cubic-bezier(.36,.07,.19,.97) forwards }

/* Particles */
.particle {
  position: absolute;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--gold);
  pointer-events: none;
  z-index: 2;
  top: 50%;
  left: 50%;
}
@keyframes burst {
  0%   { opacity: 1; transform: translate(-50%,-50%) translate(var(--dx), var(--dy)) scale(1) }
  100% { opacity: 0; transform: translate(-50%,-50%) translate(calc(var(--dx)*3.5), calc(var(--dy)*3.5)) scale(.2) }
}

.open-btn {
  position: relative;
  background: transparent;
  color: var(--gold);
  border: 1px solid var(--gold-dim);
  padding: 14px 42px;
  font-size: 14px;
  font-weight: 400;
  font-family: var(--sans);
  letter-spacing: .1em;
  text-transform: uppercase;
  border-radius: 100px;
  cursor: pointer;
  transition: color .2s, border-color .2s, box-shadow .2s, background .2s;
  overflow: hidden;
}
.open-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: var(--gold);
  opacity: 0;
  transition: opacity .2s;
}
.open-btn:hover {
  color: #07070f;
  border-color: var(--gold);
  box-shadow: 0 0 28px rgba(242,184,48,.3);
}
.open-btn:hover::before { opacity: 1 }
.open-btn span { position: relative; z-index: 1 }

/* Card */
.card {
  background: var(--surface);
  border: 1px solid var(--rim);
  border-radius: 24px;
  padding: 0;
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transition: max-height .6s cubic-bezier(.4,0,.2,1), opacity .45s ease, padding .4s ease;
}
.card.visible {
  max-height: 400px;
  opacity: 1;
  padding: 36px 32px 28px;
}

/* Golden top accent bar */
.card-accent {
  height: 3px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  border-radius: 2px;
  margin-bottom: 28px;
  opacity: 0;
  transition: opacity .4s .2s;
}
.card.visible .card-accent { opacity: 1 }

.fortune-text {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(1.25rem, 4vw, 1.6rem);
  line-height: 1.65;
  color: var(--text);
  margin-bottom: 28px;
  text-wrap: balance;
}

.divider {
  border: none;
  border-top: 1px solid var(--rim);
  margin-bottom: 20px;
}

.meta {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: rgba(255,255,255,.03);
  color: var(--muted);
  font-size: 11px;
  font-family: 'Courier New', monospace;
  padding: 6px 14px;
  border-radius: 100px;
  border: 1px solid var(--rim);
  letter-spacing: .04em;
}
.badge .dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  flex-shrink: 0;
}

.error-msg {
  margin-top: 20px;
  font-size: 12px;
  color: var(--danger);
  min-height: 18px;
  letter-spacing: .02em;
}
</style>
</head>
<body>

<canvas id="stars"></canvas>

<div class="page">
  <p class="eyebrow">Kubernetes · Fortune API</p>
  <h1>עוגיות המזל</h1>
  <p class="subtitle">כל עוגייה נאפית על ידי Pod אחר</p>

  <div class="ornament"><span>✦</span></div>

  <div class="stage">
    <div class="cookie-ring">
      <div class="halo"></div>
      <button class="cookie-btn" id="cookieBtn" onclick="getFortune()" aria-label="פתח עוגיית מזל">
        <svg class="cookie-svg" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="cg" cx="45%" cy="40%" r="60%">
              <stop offset="0%" stop-color="#ffd060"/>
              <stop offset="60%" stop-color="#e8a020"/>
              <stop offset="100%" stop-color="#b87010"/>
            </radialGradient>
            <radialGradient id="cgs" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#c07010" stop-opacity=".6"/>
              <stop offset="100%" stop-color="#c07010" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <!-- shadow -->
          <ellipse cx="70" cy="108" rx="42" ry="8" fill="#000" opacity=".3"/>
          <!-- cookie halves -->
          <path d="M22 75 Q70 38 118 75 Q118 100 70 108 Q22 100 22 75Z" fill="url(#cg)"/>
          <path d="M22 75 Q70 58 118 75" stroke="#b87010" stroke-width="1.5" fill="none" opacity=".5"/>
          <!-- top half -->
          <path d="M22 75 Q70 48 118 75 Q118 58 70 46 Q22 58 22 75Z" fill="url(#cg)" opacity=".9"/>
          <!-- inner shadow -->
          <ellipse cx="70" cy="76" rx="38" ry="16" fill="url(#cgs)"/>
          <!-- shine -->
          <ellipse cx="50" cy="60" rx="12" ry="5" fill="white" opacity=".18" transform="rotate(-25 50 60)"/>
          <ellipse cx="44" cy="57" rx="5" ry="2.5" fill="white" opacity=".25" transform="rotate(-25 44 57)"/>
          <!-- paper -->
          <rect x="44" y="71" width="52" height="13" rx="2.5" fill="#fdf3d8"/>
          <rect x="44" y="71" width="52" height="4" rx="2.5" fill="#f5e0b0" opacity=".6"/>
          <line x1="50" y1="78" x2="90" y2="78" stroke="#c8a060" stroke-width="1.2" stroke-linecap="round"/>
          <line x1="50" y1="81" x2="82" y2="81" stroke="#c8a060" stroke-width="1" stroke-linecap="round" opacity=".6"/>
        </svg>
      </button>
    </div>
    <button class="open-btn" onclick="getFortune()"><span>פתחו עוגייה</span></button>
  </div>

  <div class="card" id="card" role="region" aria-live="polite">
    <div class="card-accent"></div>
    <p class="fortune-text" id="fortuneText"></p>
    <hr class="divider">
    <div class="meta">
      <span class="badge"><span class="dot" style="background:var(--gold)"></span><span id="podName"></span></span>
      <span class="badge"><span class="dot" style="background:var(--purple)"></span><span id="versionName"></span></span>
    </div>
  </div>

  <p class="error-msg" id="errorMsg"></p>
</div>

<script>
/* Starfield */
(function() {
  const c = document.getElementById('stars');
  const ctx = c.getContext('2d');
  let W, H, stars = [];
  function resize() {
    W = c.width  = window.innerWidth;
    H = c.height = window.innerHeight;
    stars = Array.from({length: 120}, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.2 + .3,
      o: Math.random() * .7 + .15,
      s: Math.random() * 2 + 1
    }));
  }
  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    stars.forEach(s => {
      const pulse = .5 + .5 * Math.sin(t / (s.s * 900) + s.x);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${s.o * pulse})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(draw);
})();

/* Burst particles */
function burst(btn) {
  for (let i = 0; i < 10; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const angle = (i / 10) * Math.PI * 2;
    const dist = 30 + Math.random() * 25;
    p.style.cssText = `--dx:${Math.cos(angle)*dist}px;--dy:${Math.sin(angle)*dist}px`;
    p.style.background = i % 3 === 0 ? '#fff' : '#f2b830';
    btn.parentElement.appendChild(p);
    p.animate([
      { opacity: 1, transform: `translate(-50%,-50%) translate(${Math.cos(angle)*10}px,${Math.sin(angle)*10}px) scale(1)` },
      { opacity: 0, transform: `translate(-50%,-50%) translate(${Math.cos(angle)*dist*3}px,${Math.sin(angle)*dist*3}px) scale(.1)` }
    ], { duration: 600, easing: 'cubic-bezier(.2,1,.4,1)', fill: 'forwards' }).onfinish = () => p.remove();
  }
}

const btn = document.getElementById('cookieBtn');
const card = document.getElementById('card');

async function getFortune() {
  document.getElementById('errorMsg').textContent = '';
  btn.classList.add('cracking');
  burst(btn);
  btn.addEventListener('animationend', () => btn.classList.remove('cracking'), { once: true });

  try {
    const res = await fetch('/api/fortune');
    if (!res.ok) throw new Error();
    const data = await res.json();

    document.getElementById('fortuneText').textContent = '“' + data.fortune + '”';
    document.getElementById('podName').textContent = data.pod;
    document.getElementById('versionName').textContent = data.version;
    card.classList.add('visible');
  } catch {
    document.getElementById('errorMsg').textContent = 'לא ניתן להגיע ל-API — בדוק שה-port-forward פועל';
  }
}
</script>
</body>
</html>
